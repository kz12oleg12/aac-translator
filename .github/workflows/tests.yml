name: Проверки на Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write     # снимки окон кладутся в ветку ci-shots

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Зависимости
        run: python -m pip install --disable-pip-version-check mss pillow requests pystray pynput
      - name: Проверки (с окнами)
        env:
          AAC_TEST_GUI: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python tests/test_translator.py
      - name: Снимки окон
        if: always()
        env:
          PYTHONUTF8: "1"
        run: python tests/windows_shots.py
      - name: Снимки — в ветку ci-shots
        if: always()
        shell: bash
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-shots
          git rm -rf --cached . > /dev/null
          git add -f shots
          git commit -q -m "снимки окон ${GITHUB_SHA::7}"
          git push -q -f origin ci-shots
