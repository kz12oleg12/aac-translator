name: Проверки на Windows

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Зависимости
        run: python -m pip install --disable-pip-version-check mss pillow requests pystray pynput
      - name: Проверки (с окнами)
        env:
          AAC_TEST_GUI: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python tests/test_translator.py
